name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            subs: ""
          # The image that is flashed over stock first: the image checks matter most here.
          - variant: trial
            subs: "-s trial_mode true"
          # Every option on.
          - variant: all-options
            subs: "-s trial_mode true -s portable true -s bthome true -s mqtt_messages true"
          # Largest image (portable leaves the Bluetooth proxy out): the slot-size check.
          - variant: largest
            subs: "-s trial_mode true -s bthome true -s mqtt_messages true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Throwaway secrets
        run: |
          cat > secrets.yaml <<YAML
          wifi_ssid: "ci-ssid"
          wifi_password: "ci-password"
          api_key: "$(openssl rand -base64 32)"
          ota_password: "ci-ota-password"
          ap_password: "ci-ap-password"
          mqtt_broker: "192.0.2.1"
          mqtt_username: "ci-mqtt-user"
          mqtt_password: "ci-mqtt-password"
          YAML
      - uses: actions/cache@v4
        with:
          path: ~/.esphome
          key: esphome-${{ hashFiles('requirements.txt') }}
      - name: Compile
        run: esphome ${{ matrix.subs }} compile cgdn1.yaml
      - name: Host tests (component logic, merged config per option, image + sdkconfig of this build)
        run: pytest -rs
