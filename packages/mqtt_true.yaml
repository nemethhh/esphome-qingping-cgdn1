# On-screen notifications and questions over MQTT (README "Screen messages over MQTT").
# Included by cgdn1.yaml when the `mqtt_messages` substitution is "true"; needs the mqtt_*
# secrets. Topics below are under the device name (${name}, default cgdn1).

# --- MQTT (ours): notifications and questions on the screen ----------------------------------
# Alongside the HA API, only for the screen messages: discovery off (HA already has every entity
# over the API), no log topic, and no reboot when the broker is away (the 15 min default would
# restart the device). ESPHome still publishes entity states under ${name}/ and the online/offline
# status on ${name}/status.
#  - ${name}/notify (in): JSON {"text": "..", "title": "..", "id": "..", "timeout": s,
#    "wake": bool, "actions": {"tap_left": "Yes", "swipe_right": "No", ..}}, or plain text (= a
#    notification). Only "text" is needed. Without actions: a notification, any gesture
#    dismisses it, 10 s by default. With actions (tap_left / tap_centre / tap_right / swipe_left /
#    swipe_right -> label): a question, only a mapped gesture answers it, 60 s by default.
#    timeout 1..3600 s, counted from when it is first on screen; wake (default true) lights a
#    dark panel for it. One shown + 4 waiting, in arrival order; the same id replaces a queued
#    one in place. Do not publish it retained (it would come back on every reconnect).
#  - ${name}/notify/clear (in): an id removes that message; an empty payload removes all.
#  - ${name}/notify/response (out): a message with an id reports how it left the screen:
#    {"id": "..", "response": "tap_left", "label": "Yes"}, or response dismissed / timeout /
#    cleared / dropped (queue full: the oldest waiting one).
mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  log_topic: null
  reboot_timeout: 0s
  on_message:
    - topic: ${name}/notify
      then:
        - lambda: |-
            cgdn1_notify::Message m;
            if (!x.empty() && x[0] == '{') {
              const bool ok = json::parse_json(x, [&m](JsonObject root) -> bool {
                m.id = root["id"] | "";
                m.title = root["title"] | "";
                m.text = root["text"] | "";
                m.timeout_s = root["timeout"] | 0;
                m.wake = root["wake"] | true;
                JsonObject actions = root["actions"];  // null (no pairs) when missing
                for (JsonPair kv : actions) {
                  const int g = cgdn1_notify::gesture_index(kv.key().c_str());
                  if (g < 0)
                    ESP_LOGW("notify", "unknown action gesture '%s' skipped", kv.key().c_str());
                  else
                    m.labels[g] = kv.value() | "";
                }
                return true;
              });
              if (!ok) {
                ESP_LOGW("notify", "not JSON, ignored: %s", x.c_str());
                return;
              }
            } else {
              m.text = x;  // plain text: a notification
            }
            const bool question = m.question();
            const std::string mid = m.id;
            if (id(notify_q).push(std::move(m)))
              ESP_LOGI("notify", "%s '%s' queued (%u up)", question ? "question" : "notification", mid.c_str(),
                       (unsigned) id(notify_q).size());
            else
              ESP_LOGW("notify", "no text, ignored: %s", x.c_str());
        - script.execute: notify_sync
    - topic: ${name}/notify/clear
      then:
        - lambda: id(notify_q).clear(x);
        - script.execute: notify_sync
